<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="logo">Task Manager</div>

      <nav class="sidebar-menu">
        <a href="/" class="active">Dashboard</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <h1 class="page-title">Dashboard</h1>
        <div class="topbar-right">
          <div class="user-profile">Student</div>
        </div>
      </div>

      <section class="welcome-section">
        <h2>Welcome back!</h2>
        <p>Here's an overview of your tasks.</p>
      </section>

      <section class="stats-container">
        <div class="stat-card">
          <div class="stat-icon">📋</div>
          <p>Total Tasks</p>
          <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
          <div class="stat-icon">⏳</div>
          <p>Pending</p>
          <h2 id="pendingTasks">0</h2>
        </div>

        <div class="stat-card">
          <div class="stat-icon">🔄</div>
          <p>In Progress</p>
          <h2 id="inProgressTasks">0</h2>
        </div>

        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <p>Completed</p>
          <h2 id="completedTasks">0</h2>
        </div>
      </section>

      <section class="card">
        <div class="card-header">
          <h3>My Tasks</h3>
        </div>

        <div class="filter-container">
          <input type="text" id="searchInput" class="search-bar" placeholder="Search task title..." maxlength="100" />

          <select id="statusFilter">
            <option value="">All Statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>

          <button type="button" id="searchButton" class="btn btn-primary">
            Search
          </button>

          <button type="button" id="resetButton" class="btn btn-secondary">
            Reset
          </button>
        </div>

        <div id="errorMessage"></div>

        <div class="edit-task-action">
          <button type="button" id="openUpdateForm" class="btn btn-primary">
            Edit a Task
          </button>
        </div>

        <div id="taskList" class="task-list"></div>

        <div id="updateTaskContainer" class="card" style="display: none;">
          <div class="card-header">
            <h3>Update Task</h3>
          </div>

          <div id="updateMessage"></div>

          <form id="updateTaskForm">
            <input type="hidden" id="updateTaskId">

            <div class="form-group">
              <label for="taskToEdit">Select Task</label>
              <select id="taskToEdit" required>
                <option value="">Select a task</option>
              </select>
            </div>

            <div class="form-group">
              <label for="updateTitle">Task Title</label>
              <input type="text" id="updateTitle" maxlength="100" required>
            </div>

            <div class="form-group">
              <label for="updateDescription">Description</label>
              <textarea id="updateDescription" maxlength="500" required></textarea>
            </div>

            <div class="form-group">
              <label for="updateCategory">Category</label>
              <select id="updateCategory" required>
                <option value="Assignment">Assignment</option>
                <option value="Revision">Revision</option>
                <option value="Project">Project</option>
                <option value="Others">Others</option>
              </select>
            </div>

            <div class="form-group">
              <label for="updatePriority">Priority</label>
              <select id="updatePriority" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="updateDueDate">Due Date</label>
              <input type="date" id="updateDueDate" required>
            </div>

            <div class="form-group">
              <label for="updateStatus">Status</label>
              <select id="updateStatus" required>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>

              <button type="button" id="cancelUpdate" class="btn btn-secondary">
                Cancel
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="js/Kevin.js"></script>
  <script src="js/coen.js"></script>
</body>

</html>
