<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Details - Todo</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="logo">Todo</div>

        <nav class="sidebar-menu">
          <a href="/index.html" class="active"> Dashboard </a>
        </nav>
      </aside>

      <main class="main-content">
        <div class="topbar">
          <h1 class="page-title">Task Details</h1>

          <div class="topbar-right">
            <a href="/index.html" class="btn btn-secondary"> Back to Dashboard </a>
          </div>
        </div>

        <div id="errorMessage"></div>

        <section class="card" id="taskDetails" hidden>
          <div class="card-header">
            <h3 id="taskTitle">Task Title</h3>

            <span id="taskStatus" class="status"> Status </span>
          </div>

          <div class="task-detail-content">
            <div class="detail-group">
              <label>Description</label>

              <p id="taskDescription"></p>
            </div>

            <div class="detail-grid">
              <div class="detail-group">
                <label>Category</label>

                <p id="taskCategory"></p>
              </div>

              <div class="detail-group">
                <label>Priority</label>

                <p id="taskPriority"></p>
              </div>

              <div class="detail-group">
                <label>Due Date</label>

                <p id="taskDueDate"></p>
              </div>

              <div class="detail-group">
                <label>Task ID</label>

                <p id="taskId"></p>
              </div>

              <div class="detail-group">
                <label>Created At</label>

                <p id="taskCreatedAt"></p>
              </div>

              <div class="detail-group">
                <label>Last Updated</label>

                <p id="taskUpdatedAt"></p>
              </div>
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-primary" id="editButton">
              Edit Task
            </button>

            <button type="button" class="btn btn-danger" id="deleteButton">
              Delete Task
            </button>
          </div>
        </section>

        <!-- Editing form for the selected task -->
        <section class="card" id="editTaskContainer" hidden>
          <div class="card-header">
            <h3>Edit Task</h3>
          </div>

          <div id="editMessage"></div>

          <form id="editTaskForm">
            <div class="form-group">
              <label for="editTitle">Task Title</label>
              <input type="text" id="editTitle" maxlength="100" required />
            </div>

            <div class="form-group">
              <label for="editDescription">Description</label>
              <textarea id="editDescription" maxlength="500" required></textarea>
            </div>

            <div class="form-group">
              <label for="editCategory">Category</label>
              <select id="editCategory" required>
                <option value="Assignment">Assignment</option>
                <option value="Revision">Revision</option>
                <option value="Project">Project</option>
                <option value="Others">Others</option>
              </select>
            </div>

            <div class="form-group">
              <label for="editPriority">Priority</label>
              <select id="editPriority" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="editDueDate">Due Date</label>
              <input type="date" id="editDueDate" required />
            </div>

            <div class="form-group">
              <label for="editStatus">Status</label>
              <select id="editStatus" required>
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Save Changes
              </button>

              <button type="button" class="btn btn-secondary" id="cancelEditButton">
                Cancel
              </button>
            </div>
          </form>
        </section>

      </main>
    </div>

    <script src="js/task-details.js"></script>
  </body>
</html>
